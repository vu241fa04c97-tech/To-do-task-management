{% extends 'base.html' %}

{% block content %}

<div class="auth-box">

    <h2>Edit Personal Details</h2>

    {% if form.errors %}
        <div class="alert alert-danger">
            Please check your password/details.
        </div>
    {% endif %}

    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="auth-btn">
            Update Profile
        </button>

    </form>

</div>

<style>

    .auth-box {
        max-width: 600px;
        margin: auto;
        background: white;
        color: #111827;
        padding: 40px;
        border-radius: 22px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.15);
    }

    .auth-box h2 {
        color: #111827;
        text-shadow: none;
        margin-bottom: 30px;
    }

    .auth-box input,
    .auth-box select {
        width: 100%;
        background: white !important;
        color: #111827 !important;
        border: 1px solid #ddd !important;
        padding: 14px !important;
        border-radius: 10px !important;
    }

    .auth-btn {
        width: 100%;
        margin-top: 20px;
        background: linear-gradient(135deg, #7dd3c7, #60a5fa);
        color: white;
        border: none;
        padding: 14px;
        border-radius: 10px;
        font-weight: 700;
    }

</style>

{% endblock %}
