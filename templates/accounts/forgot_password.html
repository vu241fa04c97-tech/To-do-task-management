{% extends 'base.html' %}

{% block content %}

<div class="auth-box">

    <h2>Forgot Password</h2>

    {% for message in messages %}
        <div class="alert alert-info">
            {{ message }}
        </div>
    {% endfor %}

    <form method="POST">

        {% csrf_token %}

        <label>Enter Registered Email</label>

        <input type="email"
               name="email"
               class="form-control"
               placeholder="Enter your email"
               required>

        <button type="submit" class="auth-btn">
            Send OTP
        </button>

    </form>

</div>

<style>
    .auth-box {
        max-width: 500px;
        margin: auto;
        background: white;
        color: #111827;
        padding: 40px;
        border-radius: 22px;
    }

    .auth-box h2 {
        color: #111827;
        text-shadow: none;
    }

    .auth-box input {
        background: white !important;
        color: #111827 !important;
        border: 1px solid #ddd !important;
        padding: 14px !important;
        border-radius: 10px !important;
    }

    .auth-btn {
        width: 100%;
        margin-top: 20px;
        background: linear-gradient(135deg, #7dd3c7, #60a5fa);
        color: white;
        border: none;
        padding: 14px;
        border-radius: 10px;
        font-weight: 700;
    }
</style>

{% endblock %}
